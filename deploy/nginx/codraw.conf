# codraw nginx config — managed in-repo, applied by the deploy workflow.
# Domain: codraw.nerdev.in  (point DNS A record at the EC2 Elastic IP)
#
# First-time setup on the server (once):
#   sudo certbot certonly --nginx -d codraw.nerdev.in -d www.codraw.nerdev.in
#   sudo nginx -t && sudo systemctl reload nginx
# Certbot renewal is automatic (systemd timer); it never edits this file
# (certonly leaves the config untouched).

# HTTP → redirect to HTTPS handled by default.conf or certbot
server {
    listen 80;
    server_name codraw.nerdev.in www.codraw.nerdev.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name codraw.nerdev.in www.codraw.nerdev.in;

    ssl_certificate     /etc/letsencrypt/live/codraw.nerdev.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codraw.nerdev.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # Vite frontend — serve static build directly
    root /opt/codraw/apps/frontend/dist;
    index index.html;

    # SPA fallback: serve index.html for any non-file request
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTTP backend API (strip /api prefix)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket backend (direct, no prefix)
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
